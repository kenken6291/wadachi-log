<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>わだちログ — 走った道と寄り道の記録</title>
<meta name="description" content="サイクリングやドライブのルートを地図に描き、立ち寄った場所の写真・動画・メモを残す記録アプリ">
<meta name="theme-color" content="#1F2E29">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚲</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { ink: '#1F2E29', paper: '#F3F5F1', moss: '#2F5B4B', route: '#D1206B', line: '#D5DDD7', mist: '#E7ECE8' },
    fontFamily: { sans: ['"Zen Kaku Gothic New"', 'system-ui', 'sans-serif'], num: ['"Barlow Condensed"', '"Zen Kaku Gothic New"', 'sans-serif'] }
  } } };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<style>
  :root { --ink:#1F2E29; --paper:#F3F5F1; --moss:#2F5B4B; --route:#D1206B; --line:#D5DDD7; --mist:#E7ECE8; --muted:#5E6F68; --hdr:56px; }
  html, body { height: 100%; margin: 0; }
  body { overflow: hidden; background: var(--paper); color: var(--ink); font-family: "Zen Kaku Gothic New", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .num { font-family: "Barlow Condensed", "Zen Kaku Gothic New", sans-serif; font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 3px solid #3A8DDE; outline-offset: 2px; }
  button { cursor: pointer; }
  .hidden { display: none !important; }
  .acct-name { display: none; }
  @media (min-width: 640px) { .acct-name { display: inline; } }

  /* ---------- header ---------- */
  #appHeader { height: calc(var(--hdr) + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) 14px 0; box-sizing: border-box;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--ink); color: #fff; position: relative; z-index: 1100; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: .04em; white-space: nowrap; }
  .brand svg { flex: none; }
  .acct { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 14px; }
  .av { width: 28px; height: 28px; border-radius: 50%; background: var(--route); display: grid; place-items: center; font-weight: 700; }
  .menu { position: absolute; right: 0; top: calc(100% + 8px); background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 12px; min-width: 220px; padding: 6px; box-shadow: 0 12px 30px rgba(20,30,27,.2); }
  .menu button { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
  .menu button:hover { background: var(--mist); }
  .menu-email { font-size: 12px; color: var(--muted); padding: 8px 12px 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; word-break: break-all; }

  /* ---------- layout ---------- */
  #layout { position: absolute; top: calc(var(--hdr) + env(safe-area-inset-top, 0px)); left: 0; right: 0; bottom: 0; display: flex; }
  #panel { width: 410px; flex: none; background: var(--paper); border-right: 1px solid var(--line); display: flex; flex-direction: column; z-index: 900; }
  #panelBody { flex: 1; overflow-y: auto; padding: 18px 18px calc(28px + env(safe-area-inset-bottom, 0px)); overscroll-behavior: contain; }
  #panelHandle { display: none; }
  #mapWrap { position: relative; flex: 1; }
  #map { position: absolute; inset: 0; background: #DDE3DE; }
  #map.picking, #map.picking.leaflet-grab, #map.picking .leaflet-interactive { cursor: crosshair; }
  @media (max-width: 767px) {
    #mapWrap { position: absolute; inset: 0; }
    #panel { position: absolute; left: 0; right: 0; bottom: 0; width: auto; height: 46%; border-right: 0; border-radius: 18px 18px 0 0;
      box-shadow: 0 -8px 28px rgba(31,46,41,.2); transition: height .25s ease; }
    #panel[data-state="peek"] { height: 104px; }
    #panel[data-state="full"] { height: 90%; }
    #panelHandle { display: flex; justify-content: center; padding: 10px 0 6px; touch-action: none; flex: none; }
    #panelHandle span { width: 44px; height: 5px; border-radius: 3px; background: #B6C2BB; }
    #panelBody { padding-top: 4px; }
  }
  @media (prefers-reduced-motion: reduce) { #panel { transition: none; } }

  /* ---------- controls ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; padding: 9px 15px; font-weight: 700; font-size: 14px;
    border: 1px solid transparent; transition: background-color .15s, border-color .15s; line-height: 1.2; white-space: nowrap; text-decoration: none; }
  .btn-route { background: var(--route); color: #fff; }
  .btn-route:hover { background: #B51A5C; }
  .btn-ink { background: var(--ink); color: #fff; }
  .btn-ink:hover { background: #2C3F39; }
  .btn-ghost { background: #fff; border-color: var(--line); color: var(--ink); }
  .btn-ghost:hover { background: var(--mist); }
  .btn-light { background: #fff; color: var(--ink); }
  .btn-sm { padding: 7px 11px; font-size: 13px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .danger { color: #B3261E; }
  .lnk { color: var(--moss); font-weight: 700; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; background: none; border: 0; padding: 4px 2px; }
  .muted { color: var(--muted); }
  .h2 { font-size: 20px; font-weight: 700; }

  .field { display: block; margin-bottom: 14px; }
  .field > .lbl, .field > label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .inp { width: 100%; box-sizing: border-box; border: 1px solid #C3CDC6; border-radius: 10px; padding: 10px 12px; background: #fff; font-size: 16px; color: var(--ink); font-family: inherit; }
  .inp:focus { border-color: var(--moss); outline: 2px solid rgba(47,91,75,.25); outline-offset: 0; }
  textarea.inp { resize: vertical; line-height: 1.7; }
  .pw { position: relative; }
  .pw .inp { padding-right: 46px; }
  .eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); background: none; border: 0; }
  .eye:hover { background: var(--mist); }
  .ferr { color: #B3261E; font-size: 13px; min-height: 1em; margin: 4px 0 10px; white-space: pre-wrap; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
  .seg { display: flex; border: 1px solid #C3CDC6; border-radius: 10px; overflow: hidden; }
  .seg label { flex: 1; text-align: center; padding: 9px 4px; font-size: 14px; cursor: pointer; border-right: 1px solid #C3CDC6; background: #fff; }
  .seg label:last-child { border-right: 0; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label:has(input:checked) { background: var(--ink); color: #fff; font-weight: 700; }
  .seg label:has(input:focus-visible) { outline: 3px solid #3A8DDE; outline-offset: -3px; }
  .drop { display: block; border: 2px dashed #B6C2BB; border-radius: 12px; padding: 18px 14px; text-align: center; color: var(--muted); font-size: 14px; cursor: pointer; background: #fff; }
  .drop:hover, .drop.over { border-color: var(--route); color: var(--ink); }
  .drop.small { padding: 12px; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 12px; }
  .chk input { width: 18px; height: 18px; accent-color: var(--moss); }

  /* ---------- tabs ---------- */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .tab { padding: 10px 12px; font-size: 14px; font-weight: 700; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; background: none; }
  .tab.on { color: var(--ink); border-bottom-color: var(--route); }

  /* ---------- welcome ---------- */
  .wtitle { font-size: 30px; line-height: 1.35; font-weight: 700; letter-spacing: .02em; margin-top: 6px; }
  .wlead { margin-top: 12px; line-height: 1.85; font-size: 15px; color: #33443E; }
  .try { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); line-height: 1.7; }
  .note { font-size: 13px; background: #FFF4D6; border: 1px solid #EBD597; border-radius: 10px; padding: 10px 12px; margin-top: 14px; line-height: 1.6; }

  /* ---------- trip list ---------- */
  .trips { display: flex; flex-direction: column; gap: 8px; }
  .trip { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .trip:hover { border-color: #9FB0A7; }
  .trip .ti { font-size: 22px; width: 36px; height: 36px; display: grid; place-items: center; background: var(--mist); border-radius: 10px; flex: none; }
  .trip .tb { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .trip .tt { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trip .tm { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .trip .tn { text-align: right; display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
  .trip .tn b { font-size: 24px; font-weight: 600; }
  .trip .tn small { font-size: 11px; color: var(--muted); }
  .vis { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 10px; background: var(--mist); color: #3E514A; border: 1px solid transparent; }
  .vis.pub { background: #FCE4EF; color: #9C1650; }
  button.vis:hover { border-color: currentColor; }
  .like { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 700; color: var(--ink); }
  .like .hrt { font-size: 16px; line-height: 1; color: var(--route); }
  .like.on { background: #FCE4EF; border-color: #F2B8CF; color: #9C1650; }
  .like b { font-family: "Barlow Condensed", sans-serif; font-size: 16px; font-weight: 600; }
  .cms { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .cm { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .cm.mine { border-color: #C9D8D0; background: #FAFCFA; }
  .cm-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .cm-a { font-weight: 700; font-size: 14px; }
  .cm-a small { font-weight: 400; color: var(--muted); margin-left: 2px; }
  .cm-t { font-size: 14px; color: var(--muted); white-space: nowrap; }
  .cm-b { font-size: 14px; line-height: 1.75; margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
  .cm-x { display: flex; gap: 12px; justify-content: flex-end; }
  .cm-form { margin-top: 14px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .bk-list { display: flex; flex-direction: column; gap: 8px; max-height: 46vh; overflow-y: auto; margin: 10px 0; padding-right: 2px; }
  .bk { border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: #fff; display: grid; grid-template-columns: 24px 1fr; gap: 4px 8px; }
  .bk.off { opacity: .55; }
  .bk input[type=checkbox] { width: 18px; height: 18px; margin-top: 8px; accent-color: var(--moss); }
  .bk-f { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .bk-f .full { grid-column: 1 / -1; }
  .bk .inp { padding: 7px 9px; font-size: 14px; }
  .bk-m { grid-column: 2; display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
  .bk-m .st { font-weight: 700; }
  .bk-m .ok { color: var(--moss); } .bk-m .ng { color: #B3261E; } .bk-m .run { color: var(--route); }
  .trip-row { display: flex; align-items: stretch; gap: 6px; }
  .trip-row .trip { flex: 1; min-width: 0; }
  .tchk { display: flex; align-items: center; justify-content: center; width: 30px; flex: none; cursor: pointer; border-radius: 8px; }
  .tchk:hover { background: var(--mist); }
  .tchk input { width: 20px; height: 20px; cursor: pointer; }
  .tchk input:disabled { cursor: default; opacity: .35; }
  .trip.sel { box-shadow: inset 4px 0 0 var(--c, var(--route)); }
  .sel-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; font-size: 13px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; }
  .sel-bar b { font-family: "Barlow Condensed", sans-serif; font-size: 17px; }
  .owner { font-size: 13px; font-weight: 700; color: var(--moss); }
  .empty { background: #fff; border: 1px dashed #B6C2BB; border-radius: 12px; padding: 18px; line-height: 1.75; }

  /* ---------- trip detail: the cycle-computer ---------- */
  .back { font-size: 13px; font-weight: 700; color: var(--moss); background: none; border: 0; padding: 4px 0; margin-bottom: 8px; }
  .ttl { font-size: 22px; font-weight: 700; line-height: 1.4; word-break: break-word; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--muted); margin-top: 4px; }
  .desc { font-size: 14px; line-height: 1.75; margin-top: 10px; white-space: pre-wrap; }
  .meter { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--ink); color: #fff; border-radius: 14px; margin-top: 14px; overflow: hidden; }
  .meter > div { padding: 12px 10px 10px; border-right: 1px solid rgba(255,255,255,.1); display: flex; flex-direction: column; }
  .meter > div:last-child { border-right: 0; }
  .mv { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 34px; line-height: 1; letter-spacing: .01em; }
  .mv small { font-size: 15px; font-weight: 500; margin-left: 2px; color: #BFD0C8; }
  .ml { font-size: 11px; color: #9FB4AA; margin-top: 6px; }
  .meter.empty-route .mv { color: #6F8A7E; }
  .profile { margin-top: 10px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px 4px; }
  .profile-h { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  #profileSvg { width: 100%; height: 72px; display: block; touch-action: none; cursor: crosshair; }
  #profileSvg .pa { fill: rgba(209,32,107,.13); }
  #profileSvg .pl { fill: none; stroke: var(--route); stroke-width: 2; }
  #profileSvg .pc { stroke: var(--ink); stroke-width: 1.5; }
  .acts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 14px; }
  .acts .btn { padding: 10px 6px; font-size: 13px; flex-direction: column; gap: 4px; white-space: normal; }
  .acts .btn span:first-child { font-size: 18px; }
  .subacts { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 8px; }

  /* ---------- timeline ---------- */
  .tl { list-style: none; margin: 0; padding: 0; position: relative; }
  .tl::before { content: ""; position: absolute; left: 13px; top: 6px; bottom: 6px; width: 2px; background: repeating-linear-gradient(to bottom, var(--route) 0 6px, transparent 6px 11px); opacity: .55; }
  .tl-item { position: relative; padding-left: 40px; margin-bottom: 16px; }
  .tl-no { position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center;
    font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 15px; box-shadow: 0 0 0 3px var(--paper); }
  .tl-body { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .tl-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 0; }
  .tl-title { font-weight: 700; font-size: 15px; }
  .tl-time { font-family: "Barlow Condensed", sans-serif; font-size: 15px; color: var(--muted); white-space: nowrap; }
  .tl-memo { font-size: 13px; line-height: 1.7; margin-top: 6px; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .tl-actions { display: flex; gap: 12px; margin-top: 4px; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .thumb { width: 60px; height: 60px; border-radius: 8px; overflow: hidden; background: var(--mist); border: 0; padding: 0; position: relative; display: grid; place-items: center; font-weight: 700; color: var(--muted); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .vid { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 16px; background: rgba(20,30,27,.35); }

  /* ---------- AI ---------- */
  .ai { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .ai-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .ai h4 { font-weight: 700; font-size: 15px; }
  .ai-h p { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.5; }
  .ai-out { margin-top: 10px; font-size: 14px; }

  /* ---------- map overlays ---------- */
  #pickBanner { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 800; background: var(--ink); color: #fff; border-radius: 999px;
    padding: 8px 8px 8px 16px; display: flex; align-items: center; gap: 10px; font-size: 14px; box-shadow: 0 6px 20px rgba(20,30,27,.3); max-width: calc(100% - 100px); }
  #pickBanner button { background: #fff; color: var(--ink); border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: 13px; flex: none; }
  #playbar { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 800; background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 8px 10px; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 24px rgba(20,30,27,.2); width: min(560px, calc(100% - 24px)); box-sizing: border-box; }
  #playbar input[type=range] { flex: 1; accent-color: var(--route); min-width: 60px; }
  #playbar select { border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; font-size: 13px; background: #fff; }
  #pbBtn { width: 38px; height: 38px; border-radius: 50%; background: var(--route); color: #fff; font-size: 14px; flex: none; }
  #pbInfo { font-size: 17px; min-width: 88px; text-align: right; white-space: nowrap; }
  #playbar { flex-wrap: wrap; row-gap: 8px; }
  .pb-row2 { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); padding-top: 8px; min-height: 34px; }
  .pb-near { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; }
  .pb-near img { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; flex: none; background: var(--mist); }
  .pb-near .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pb-add { flex: none; }
  .pb-info { background: none; border: 0; padding: 2px 4px; border-radius: 6px; color: var(--ink); text-decoration: underline dotted; text-underline-offset: 4px; }
  .pb-info:hover { background: var(--mist); }
  .pb-jump { position: absolute; right: 0; bottom: calc(100% + 8px); width: 300px; max-width: calc(100vw - 24px); background: #fff; border: 1px solid var(--line);
    border-radius: 14px; padding: 12px; box-shadow: 0 10px 30px rgba(20,30,27,.25); z-index: 5; }
  .pb-jump h4 { font-weight: 700; font-size: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
  .pb-jump form { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .pb-jump .lb { font-size: 12px; font-weight: 700; width: 34px; flex: none; }
  .pb-jump .inp { padding: 7px 9px; font-size: 15px; flex: 1; min-width: 0; }
  .pb-jump .u { font-size: 12px; color: var(--muted); flex: none; }
  .pb-jump .rng { font-size: 11px; color: var(--muted); margin: -4px 0 8px 40px; }
  .pb-opt { display: flex; align-items: center; gap: 4px; font-size: 12px; white-space: nowrap; flex: none; color: var(--muted); }
  .pb-opt input { width: 16px; height: 16px; accent-color: var(--route); }
  #pbPhoto { position: absolute; z-index: 820; left: 16px; top: 16px; width: 380px; max-width: calc(100% - 32px); background: #fff; border-radius: 16px; overflow: hidden;
    box-shadow: 0 14px 40px rgba(20,30,27,.35); animation: pbIn .25s ease; }
  @keyframes pbIn { from { opacity: 0; transform: translateY(-8px) scale(.98); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #pbPhoto { animation: none; } }
  .pp-stage { position: relative; background: #111A17; aspect-ratio: 4 / 3; display: grid; place-items: center; cursor: zoom-in; }
  .pp-stage img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .pp-stage .play { position: absolute; width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.9); color: var(--route); display: grid; place-items: center; font-size: 22px; }

/* ---------- API ---------- */
const GAS_URL_OK = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(GAS_URL.trim());
function gasReady() { return GAS_URL_OK; }
async function api(action, data = {}) {
  if (!gasReady()) throw new Error('GAS_URL の形式が正しくありません。config.js の GAS_URL を「https://script.google.com/macros/s/…/exec」だけにしてください（/exec の後ろに文字が残っていないか確認）');
  let res;
  try {
    res = await fetch(GAS_URL.trim(), {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // プリフライトを発生させない
      body: JSON.stringify({ action, token: S.token, ...data })
    });
  } catch (e) {
    throw new Error('サーバーに接続できませんでした。通信状況を確認してください');
  }
  if (!res.ok) throw new Error('通信エラー（' + res.status + '）');
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('サーバーの応答を読み取れませんでした。GASのデプロイ設定を確認してください'); }
  if (!j.ok) {
    if (j.error === 'AUTH' && action !== 'login') logout(true, j.message);
    if (j.error === 'AGREE' && S.user) { S.user.needsAgreement = true; renderHeader(); openAgree(); }
    const e = new Error(j.message || 'エラーが発生しました');
    e.code = j.error;
    throw e;
  }
  return j;
}

let map, routeLayer, spotLayer, previewLayer, multiLayer, hoverMarker;

    maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors' });
  const gsiPhoto = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', {
    maxZoom: 18, attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル（写真）</a>' });

  const gsiStd = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>' });

  // OSM のタイルが続けて読めないときは地理院地図に自動で切り替える

  });
}

/* ---------- route parsing ---------- */
function byTag(el, name) { return Array.from(el.getElementsByTagNameNS('*', name)); }
function parseRouteText(text, nameHint = '') {
  const t = String(text || '').replace(/^\uFEFF/, '').trim();
  if (!t) throw new Error('内容が空です');
  if (t[0] === '{' || t[0] === '[') {
    let obj;
    try { obj = JSON.parse(t); } catch (e) { throw new Error('JSONとして読み取れませんでした'); }
    if (obj && obj.wadachi && Array.isArray(obj.points)) return { name: obj.name || nameHint, points: obj.points };
    return parseGeoJSON(obj, nameHint);
  }
  const xml = new DOMParser().parseFromString(t, 'application/xml');
  if (xml.getElementsByTagName('parsererror').length) throw new Error('ファイルを読み取れませんでした（GPX・KML・GeoJSON に対応）');

  if (root === 'gpx') return parseGPX(xml, nameHint);
  if (root === 'kml' || byTag(xml, 'Placemark').length) return parseKML(xml, nameHint);
  throw new Error('対応していない形式です（GPX・KML・GeoJSON に対応）');
}
function parseGPX(xml, hint) {
  let nodes = byTag(xml, 'trkpt');
  if (!nodes.length) nodes = byTag(xml, 'rtept');
  if (!nodes.length) nodes = byTag(xml, 'wpt');
  const points = nodes.map(p => {
    const ele = byTag(p, 'ele')[0], time = byTag(p, 'time')[0];
    return [parseFloat(p.getAttribute('lat')), parseFloat(p.getAttribute('lon')),
      ele ? parseFloat(ele.textContent) : null, time ? (Date.parse(time.textContent) || null) : null];
  });

  const nm = (trk && byTag(trk, 'name')[0]) || byTag(xml, 'name')[0];
  return { name: (nm && nm.textContent.trim()) || hint, points };
}
function parseKML(xml, hint) {
  const points = [];
  const tracks = byTag(xml, 'Track');
  if (tracks.length) {
    tracks.forEach(tr => {
      const whens = byTag(tr, 'when'), coords = byTag(tr, 'coord');
      coords.forEach((c, i) => {
        const [lng, lat, ele] = c.textContent.trim().split(/\s+/).map(Number);
        points.push([lat, lng, isFinite(ele) ? ele : null, whens[i] ? (Date.parse(whens[i].textContent) || null) : null]);
      });
    });
  } else {
    byTag(xml, 'LineString').forEach(ls => {
      const co = byTag(ls, 'coordinates')[0];
      if (!co) return;
      co.textContent.trim().split(/\s+/).forEach(s => {
        const [lng, lat, ele] = s.split(',').map(Number);
        if (isFinite(lat) && isFinite(lng)) points.push([lat, lng, isFinite(ele) ? ele : null, null]);
      });
    });
  }
  const doc = byTag(xml, 'Document')[0] || xml.documentElement;
  const nm = byTag(doc, 'name')[0];

}
function parseGeoJSON(obj, hint) {

    points.push([c[1], c[0], c.length > 2 && isFinite(c[2]) ? c[2] : null, times && times[i] ? (Date.parse(times[i]) || null) : null]);

      case 'MultiLineString': g.coordinates.forEach((l, i) => {
        const ct = props && props.coordTimes;
        addLine(l, Array.isArray(ct) && Array.isArray(ct[i]) ? ct[i] : null);
      }); break;
      case 'GeometryCollection': (g.geometries || []).forEach(x => walk(x, props)); break;

}
function normalizeRoute(r) {
  let pts = (r.points || []).map(p => [+p[0], +p[1],
    p[2] == null || !isFinite(+p[2]) ? null : +p[2],
    p[3] == null || !isFinite(+p[3]) ? null : +p[3]])
    .filter(p => isFinite(p[0]) && isFinite(p[1]) && Math.abs(p[0]) <= 90 && Math.abs(p[1]) <= 180);
  pts = pts.filter((p, i) => i === 0 || p[0] !== pts[i - 1][0] || p[1] !== pts[i - 1][1]);
  if (pts.length < 2) throw new Error('ルートとして読み取れる点が見つかりませんでした');
  const MAX = 8000;
  if (pts.length > MAX) {
    const step = pts.length / MAX, out = [];
    for (let i = 0; i < MAX - 1; i++) out.push(pts[Math.floor(i * step)]);
    out.push(pts[pts.length - 1]);
    pts = out;
  }
  pts = pts.map(p => [Math.round(p[0] * 1e6) / 1e6, Math.round(p[1] * 1e6) / 1e6, p[2] == null ? null : Math.round(p[2] * 10) / 10, p[3]]);

}
function hav(a, b) {
  const R = 6371000, k = Math.PI / 180;
  const dLat = (b[0] - a[0]) * k, dLng = (b[1] - a[1]) * k;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * k) * Math.cos(b[0] * k) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(x)));
}
function computeStats(pts) {
  const cum = [0];

  let gain = 0, ref = null, maxEle = -Infinity, minEle = Infinity, hasEle = false;
  pts.forEach(p => {
    const e = p[2];
    if (e == null) return;
    hasEle = true;
    if (e > maxEle) maxEle = e;
    if (e < minEle) minEle = e;
    if (ref === null) ref = e;
    else if (e - ref >= 3) { gain += e - ref; ref = e; }  // 3mのヒステリシスでGPSノイズを除く
    else if (ref - e >= 3) ref = e;
  });
  const times = pts.map(p => p[3]).filter(t => t != null);
  const startTime = times.length ? Math.min(...times) : null;
  const endTime = times.length ? Math.max(...times) : null;
  return {
    distanceKm: dist / 1000, elevationGainM: Math.round(gain),
    durationSec: startTime != null && endTime > startTime ? Math.round((endTime - startTime) / 1000) : 0,
    cum, hasEle, maxEle: hasEle ? maxEle : 0, minEle: hasEle ? minEle : 0, startTime, endTime

}

/* ---------- elevation profile ---------- */
function idxAtDist(target) {
  const c = S.stats.cum;
  let lo = 0, hi = c.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (c[mid] < target) lo = mid + 1; else hi = mid; }
  return lo;
}
function posAtFrac(f) {
  const c = S.stats.cum, pts = S.route.points, tot = c[c.length - 1];
  const target = f * tot;
  const i = Math.max(1, idxAtDist(target));
  const a = pts[i - 1], b = pts[i];
  const seg = (c[i] - c[i - 1]) || 1;
  const r = Math.min(1, Math.max(0, (target - c[i - 1]) / seg));
  const t = (a[3] != null && b[3] != null) ? a[3] + (b[3] - a[3]) * r : null;
  const e = (a[2] != null && b[2] != null) ? a[2] + (b[2] - a[2]) * r : null;
  return { lat: a[0] + (b[0] - a[0]) * r, lng: a[1] + (b[1] - a[1]) * r, dist: target, time: t, ele: e };
}
function profileHtml() {
  const st = S.stats;
  if (!st || !st.hasEle) return '';
  const pts = S.route.points, n = pts.length, N = Math.min(320, n), tot = st.cum[n - 1] || 1, rng = (st.maxEle - st.minEle) || 1;
  let d = '';
  for (let k = 0; k < N; k++) {
    const i = Math.round(k * (n - 1) / (N - 1));
    const e = pts[i][2];
    if (e == null) continue;
    const x = st.cum[i] / tot * 1000, y = 152 - (e - st.minEle) / rng * 136;
    d += (d ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
  }
  return `<div class="profile">
    <div class="profile-h"><span>標高</span><span id="profInfo" class="num">${Math.round(st.minEle)}〜${Math.round(st.maxEle)} m</span></div>
    <svg id="profileSvg" viewBox="0 0 1000 160" preserveAspectRatio="none" role="img" aria-label="標高グラフ">
      <path d="${d} L1000 160 L0 160 Z" class="pa"/><path d="${d}" class="pl" vector-effect="non-scaling-stroke"/>
      <line id="profCursor" x1="0" x2="0" y1="0" y2="160" class="pc" vector-effect="non-scaling-stroke" style="display:none"/>
    </svg></div>`;
}
function bindProfile() {
  const svg = $('#profileSvg');
  if (!svg) return;
  const move = e => {
    const r = svg.getBoundingClientRect();
    const f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    const p = posAtFrac(f);
    const line = $('#profCursor');
    line.setAttribute('x1', f * 1000); line.setAttribute('x2', f * 1000); line.style.display = '';
    if (!hoverMarker) hoverMarker = L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', html: '<div class="hover-dot"></div>', iconSize: [14, 14], iconAnchor: [7, 7] }), interactive: false, zIndexOffset: 900 });
    hoverMarker.setLatLng([p.lat, p.lng]).addTo(map);
    $('#profInfo').textContent = `${(p.dist / 1000).toFixed(1)} km 地点 ${p.ele != null ? Math.round(p.ele) + ' m' : ''}`;
  };
  const leave = () => {
    const line = $('#profCursor'); if (line) line.style.display = 'none';
    if (hoverMarker) hoverMarker.remove();
    const info = $('#profInfo'); if (info && S.stats) info.textContent = `${Math.round(S.stats.minEle)}〜${Math.round(S.stats.maxEle)} m`;
  };
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', leave);
}

/* ---------- playback ---------- */
const PB = { on: false, playing: false, frac: 0, last: 0, raf: 0, marker: null, nearId: null, hold: false, shown: new Set(), card: null, cardT: 0, mk: null, prevDist: -1 };
const PP_SEC = { photo: 3, video: 3.5 }; // 1枚あたりの表示秒数
const NEAR_M = 250; // この距離以内のスポットを「近くのスポット」として表示

function pbSet(f) {

/**
 * スポットを、ルート上の「何km地点か」に対応づける（日時の順に、ルートを前へ進みながら探す）。
 * スタートとゴールが同じ場所のルートでも、最後のスポットを最初に拾わないようにするため。
 */
function pbMarks() {
  if (PB.mk) return PB.mk;
  const pts = S.route.points, cum = S.stats.cum, n = pts.length, TH = 300;
  const list = [];
  let from = 0;
  sortedSpots().forEach(s => {
    const q = [+s.lat, +s.lng];
    if (!isFinite(q[0]) || !isFinite(q[1])) return;
    let idx = -1, off = Infinity;
    for (let i = from; i < n; i++) {
      if (hav(pts[i], q) > TH) continue;
      // 最初に近づいた区間の中で、いちばん近い点

    }
    let advance = true;
    if (idx < 0) { // ルートから離れたスポット：残りの区間でいちばん近い点
      for (let i = from; i < n; i++) { const d = hav(pts[i], q); if (d < off) { off = d; idx = i; } }
      advance = off <= 2000; // 大きく離れたスポットで、探す位置を先へ飛ばさない
    }
    if (idx < 0) return;
    list.push({ s, dist: cum[idx], off });
    if (advance) from = idx;
  });
  list.sort((a, b) => a.dist - b.dist);

  return list;
}
/** 再生中に通過したスポットの写真を出す。写真を出したら true */
function pbCheckMarks(cur) {
  for (const m of pbMarks()) {

    if (m.dist < PB.prevDist || PB.shown.has(m.s.spotId) || !(m.s.media || []).length || m.off > NEAR_M * 2) continue;
    // 再生を始めた地点のスポットは、止めずに写真だけ見せる（「動かない」ように見えないため）
    pbShowPhotos(m.s, m.dist <= PB.startDist + 1);
    return true;
  }
  PB.prevDist = cur;
  return false;
}
function pbUpdateNear(p) {
  let near = null, bestD = Infinity;
  pbMarks().forEach(m => {
    if (m.off > NEAR_M) return;
    const d = Math.abs(m.dist - p.dist);
    if (d <= NEAR_M && d < bestD) { bestD = d; near = m.s; }
  });
  const id = near ? near.spotId : null;
  if (id === PB.nearId) return;

}

/* ---------- 再生中の写真ポップアップ ---------- */
function pbShowPhotos(s, noHold) {

}
function renderPbCard(auto) {

      ${n > 1 ? `<button class="nav prev" data-act="ppNav" data-d="-1" aria-label="前の写真">‹</button><button class="nav next" data-act="ppNav" data-d="1" aria-label="次の写真">›</button><span class="cnt num">${c.i + 1} / ${n}</span>` : ''}

      <div class="pp-a"><button class="lnk" data-act="ppOpen">大きく見る</button>${canEdit() ? `<button class="lnk" data-act="pbEdit" data-id="${esc(s.spotId)}">編集・削除</button>` : ''}</div>
    </div>`;
  const wasHidden = box.classList.contains('hidden');

  if (media[c.i + 1]) { const im = new Image(); im.src = thumbUrl(media[c.i + 1].fileId, 1000); }
  clearTimeout(PB.cardT);
  if (auto && PB.playing) {
    const sec = isVideo(m) ? PP_SEC.video : PP_SEC.photo;
    pbCardBar(true, sec);
    PB.cardT = setTimeout(() => {
      if (!PB.card || PB.card.s !== s) return;

}
function pbCardBar(on, sec) {
  const bar = $('#ppBar');
  if (!bar) return;
  if (!on) { bar.classList.remove('go'); bar.style.transitionDuration = '0s'; return; }
  bar.style.transitionDuration = sec + 's';
  requestAnimationFrame(() => requestAnimationFrame(() => bar.classList.add('go')));
}
function pbHideCard() {
  clearTimeout(PB.cardT);

  PB.hold = false;
  const box = $('#pbPhoto');
  if (box) { box.classList.add('hidden'); box.innerHTML = ''; }
}
function pbRefresh() { PB.mk = null; if (PB.on && S.route) { PB.nearId = undefined; pbSet(PB.frac); } }
function pbTick(ts) {
  if (!PB.playing) return;
  const dt = PB.last ? Math.min(0.5, (ts - PB.last) / 1000) : 0;
  PB.last = ts;
  try {
    if (PB.hold && !PB.card) PB.hold = false; // 写真カードが無いのに止まったままにならないように
    if (!PB.hold) { // 写真表示中は進めない
      const f = PB.frac + dt / (Number($('#pbSpeed').value) || 45);
      const p = pbSet(Math.min(1, f));
      pbCheckMarks(p.dist);
      pbKeepVisible();
      if (f >= 1 && !PB.hold) { pbPause(); return; }
    }
  } catch (e) {
    console.error('再生エラー', e); // 1回の失敗で再生が止まらないように
  }
  PB.raf = requestAnimationFrame(pbTick);
}
/** 再生マーカーが、再生バー・写真カード・下部パネルに隠れない位置に来るよう地図を動かす */
function pbKeepVisible(force) {
  if (!PB.marker || !map.hasLayer(PB.marker)) return;
  const wrap = $('#mapWrap').getBoundingClientRect();
  const size = map.getSize();
  const pt = map.latLngToContainerPoint(PB.marker.getLatLng());
  let top = 50, left = 40, right = size.x - 64, bottom = size.y - 30;
  const card = $('#pbPhoto');
  if (card && !card.classList.contains('hidden')) {
    const r = card.getBoundingClientRect();
    if (isMobile()) top = Math.max(top, r.bottom - wrap.top + 12);
    else left = Math.max(left, r.right - wrap.left + 12);
  }
  const bar = $('#playbar');
  if (bar && !bar.classList.contains('hidden')) bottom = Math.min(bottom, bar.getBoundingClientRect().top - wrap.top - 12);
  if (isMobile()) bottom = Math.min(bottom, $('#panel').getBoundingClientRect().top - wrap.top - 12);
  if (bottom - top < 40) top = Math.max(8, bottom - 40);
  const out = pt.x < left || pt.x > right || pt.y < top || pt.y > bottom;
  if (out || force) map.panBy([pt.x - (left + right) / 2, pt.y - (top + bottom) / 2], { animate: true, duration: .4 });
}
function pbPlay() {
  if (PB.playing) { pbPause(); return; }

  if (PB.card) { PB.shown.add(PB.card.s.spotId); pbHideCard(); }
  const d0 = posAtFrac(PB.frac).dist;
  PB.startDist = d0; PB.prevDist = d0 - 1; // 今いる地点のスポットも拾う
  PB.playing = true; PB.last = 0; PB.nearId = undefined;
  const b = $('#pbBtn'); b.textContent = '❚❚'; b.setAttribute('aria-label', '一時停止');
  PB.raf = requestAnimationFrame(pbTick);
}
function pbPause() {
  PB.playing = false;
  PB.hold = false;

  if (PB.card) { clearTimeout(PB.cardT); pbCardBar(false); } // カードは残し、自動送りだけ止める
  const b = $('#pbBtn'); b.textContent = '▶'; b.setAttribute('aria-label', '再生');
}
function pbReset() { PB.frac = 0; PB.mk = null; if (PB.on) showPlaybar(false); }

/* ---------- 距離・時刻を指定して移動 ---------- */
function openPbJump() {
  if (!S.route) return;
  pbPause();
  const st = S.stats, totKm = st.cum[st.cum.length - 1] / 1000;
  const p = posAtFrac(PB.frac);
  const multi = st.startTime != null && dateOf(st.startTime) !== dateOf(st.endTime);
  const hm = ms => { const d = new Date(ms); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
  const box = $('#pbJump');
  const cur = p.time || st.startTime;
  box.innerHTML = `<h4>位置を指定して移動<button class="x" data-act="pbJumpClose" aria-label="閉じる" style="width:28px;height:28px;font-size:18px">×</button></h4>
    <form id="fJumpKm" novalidate><span class="lb">距離</span>
      <input class="inp num" type="number" name="km" step="0.1" min="0" max="${totKm.toFixed(1)}" value="${(p.dist / 1000).toFixed(1)}" inputmode="decimal" aria-label="スタートからの距離（km）">
      <span class="u">km</span><button type="submit" class="btn btn-ink btn-sm">移動</button></form>
    <p class="rng">0〜${fmtKm(totKm)} km</p>
    ${st.startTime != null ? `<form id="fJumpTm" novalidate><span class="lb">時刻</span>
      <input class="inp num" type="${multi ? 'datetime-local' : 'time'}" name="tm" value="${multi ? toLocalInput(new Date(cur).toISOString()) : hm(cur)}" aria-label="通過時刻">
      <button type="submit" class="btn btn-ink btn-sm">移動</button></form>
    <p class="rng">${multi ? fmtTime(new Date(st.startTime).toISOString()) + '〜' + fmtTime(new Date(st.endTime).toISOString()) : hm(st.startTime) + '〜' + hm(st.endTime)}</p>`
    : '<p class="rng" style="margin-left:0">このルートには時刻の記録がないため、距離で指定してください。</p>'}
    <p class="ferr" style="margin:0"></p>`;
  box.classList.remove('hidden');
  const err = box.querySelector('.ferr');
  $('#fJumpKm').addEventListener('submit', e => {
    e.preventDefault();
    const km = parseFloat(e.target.km.value);
    if (!isFinite(km) || km < 0) { err.textContent = '距離を数字で入力してください'; return; }
    pbJumpTo(Math.min(1, (km * 1000) / (st.cum[st.cum.length - 1] || 1)));
  });
  const ft = $('#fJumpTm');
  if (ft) ft.addEventListener('submit', e => {
    e.preventDefault();
    const v = e.target.tm.value;
    if (!v) { err.textContent = '時刻を入力してください'; return; }
    const target = multi ? new Date(v).getTime() : new Date(`${dateOf(st.startTime)}T${v}`).getTime();
    if (isNaN(target)) { err.textContent = '時刻を読み取れませんでした'; return; }
    if (target < st.startTime || target > st.endTime) { err.textContent = '記録の時間の範囲内で指定してください'; return; }
    pbJumpTo(fracAtTime(target));
  });
  if (!isMobile()) setTimeout(() => { const i = box.querySelector('input'); if (i) i.select(); }, 30);
}
function fracAtTime(target) {
  const pts = S.route.points, c = S.stats.cum, tot = c[c.length - 1] || 1;
  let prev = -1;
  for (let i = 0; i < pts.length; i++) {
    const t = pts[i][3];
    if (t == null) continue;
    if (t >= target) {
      if (prev < 0 || t === pts[prev][3]) return c[i] / tot;
      const r = (target - pts[prev][3]) / (t - pts[prev][3]);
      return (c[prev] + (c[i] - c[prev]) * r) / tot;
    }
    prev = i;
  }
  return 1;
}
function pbJumpTo(frac) {

  pbHideCard();
  PB.shown.clear();
  PB.nearId = undefined;
  pbSet(frac);
  pbKeepVisible(true);
}

/* ---------- 一覧で選んだルートの重ね表示 ---------- */
const SEL_COLORS = ['#D1206B', '#1F6FD1', '#2E8B3E', '#E67E00', '#7B3FC4', '#0F9AA8', '#8C5A2B', '#A6A000', '#D94FA5', '#3A4A44'];
const SEL_MAX = 50;
function selColor(i) { return SEL_COLORS[i % SEL_COLORS.length]; }
function saveSel() { ls.set('wadachi.sel', JSON.stringify(S.sel)); }
function allKnownTrips() {
  const m = {};
  S.trips.concat(S.publicTrips, S.sharedTrips).forEach(t => { m[t.tripId] = t; });
  return m;
}
async function setSelected(ids, on, fit) {
  ids.forEach(id => {
    const i = S.sel.indexOf(id);
    if (on && i < 0) S.sel.push(id);
    if (!on && i >= 0) S.sel.splice(i, 1);
  });
  if (S.sel.length > SEL_MAX) { S.sel = S.sel.slice(0, SEL_MAX); toast(`同時に表示できるのは${SEL_MAX}件までです`, 'err'); }

async function drawMulti(fit) {
  if (!multiLayer) return;
  multiLayer.clearLayers();
  if (S.trip || !S.user || !S.sel.length) return;
  const need = S.sel.filter(id => !S.routeCache[id]);
  if (need.length) {
    toast(`ルートを読み込んでいます（${need.length}件）…`);
    try {
      const r = await api('getRoutes', { tripIds: need });
      need.forEach(id => { S.routeCache[id] = r.routes[id] || []; });
    } catch (e) { toast(e.message, 'err'); return; }
    if (S.trip) return; // 読み込み中にトリップを開いた場合
  }
  multiLayer.clearLayers();
  const trips = allKnownTrips();
  const bounds = L.latLngBounds([]);
  // 選択の古い順に描き、新しく選んだものを上に重ねる
  S.sel.forEach((id, i) => {
    const pts = S.routeCache[id];
    if (!pts || pts.length < 2) return;
    const col = selColor(i);
    const t = trips[id] || {};
    const label = `${t.title || 'ルート'}${t.startDate ? '（' + fmtDate(t.startDate) + '）' : ''}`;
    L.polyline(pts, { color: '#fff', weight: 7, opacity: .9, interactive: false }).addTo(multiLayer);
    const line = L.polyline(pts, { color: col, weight: 4, opacity: .95 }).addTo(multiLayer);
    line.bindTooltip(esc(label), { sticky: true });
    line.on('click', () => openTrip(id));
    line.on('mouseover', () => line.setStyle({ weight: 7 }));
    line.on('mouseout', () => line.setStyle({ weight: 4 }));
    L.circleMarker(pts[0], { radius: 5, color: '#fff', weight: 2, fillColor: col, fillOpacity: 1 }).bindTooltip(esc(label)).on('click', () => openTrip(id)).addTo(multiLayer);
    pts.forEach(p => bounds.extend(p));
  });
  if (fit && bounds.isValid()) {
    const bottom = isMobile() ? Math.round(window.innerHeight * 0.45) : 30;
    map.fitBounds(bounds, { paddingTopLeft: [30, 40], paddingBottomRight: [30, bottom], maxZoom: 14 });
  }
}
function fitMulti() {
  const b = L.latLngBounds([]);
  S.sel.forEach(id => (S.routeCache[id] || []).forEach(p => b.extend(p)));
  if (!b.isValid()) return;
  const bottom = isMobile() ? Math.round(window.innerHeight * 0.45) : 30;
  map.fitBounds(b, { paddingTopLeft: [30, 40], paddingBottomRight: [30, bottom], maxZoom: 14 });
  setSheet('peek');
}

const SHEET_LEVELS = ['peek', 'half', 'full'];
function setSheet(st) {
  if (!isMobile()) return;

function bindSheet() {
  const h = $('#panelHandle');
  let y0 = null;
  h.addEventListener('pointerdown', e => { y0 = e.clientY; h.setPointerCapture(e.pointerId); });
  h.addEventListener('pointerup', e => {
    if (y0 === null) return;
    const dy = e.clientY - y0; y0 = null;
    const cur = SHEET_LEVELS.indexOf($('#panel').dataset.state);
    let next;
    if (dy < -30) next = Math.min(2, cur + 1);
    else if (dy > 30) next = Math.max(0, cur - 1);
    else next = (cur + 1) % 3;
    setSheet(SHEET_LEVELS[next]);
  });
  h.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); const cur = SHEET_LEVELS.indexOf($('#panel').dataset.state); setSheet(SHEET_LEVELS[(cur + 1) % 3]); } });

function bumpCounts() {

function bindComments() {

  f.elements.body.addEventListener('input', e => { S.cmtDraft = e.target.value; });
  bindForm(f, async d => {
    if (!d.body.trim()) throw new Error('コメントを入力してください');
    const r = await api('addComment', { tripId: S.trip.tripId, body: d.body });
    S.comments.push(r.comment);
    S.cmtDraft = '';
    bumpCounts(); renderPanel();
    const list = $$('#panelBody .cm'); if (list.length) list[list.length - 1].scrollIntoView({ block: 'nearest' });

  $$('#panelBody form.cm-edit').forEach(ef => {
    bindForm(ef, async d => {
      if (!d.body.trim()) throw new Error('コメントを入力してください');
      const r = await api('updateComment', { commentId: ef.dataset.id, body: d.body });
      const i = S.comments.findIndex(c => c.commentId === ef.dataset.id);
      if (i >= 0) S.comments[i] = r.comment;
      S.editCmt = null; renderPanel(); toast('コメントを修正しました');
    });
    const ta = ef.querySelector('textarea');
    if (ta && !isMobile()) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  });
}
async function deleteComment(id) {
  const c = S.comments.find(x => x.commentId === id);
  if (!c) return;
  const who = c.isMine ? '' : `（${c.authorName} さんのコメント）`;
  if (!confirm(`このコメントを削除しますか？${who}\n削除すると元に戻せません。`)) return;
  try {
    await api('deleteComment', { commentId: id });
    S.comments = S.comments.filter(x => x.commentId !== id);
    bumpCounts(); renderPanel(); toast('コメントを削除しました');
  } catch (e) { toast(e.message, 'err'); }
}
let likeBusy = false;
async function toggleLike() {
  if (likeBusy || !S.trip) return;
  likeBusy = true;
  const prev = { liked: S.liked, count: S.likeCount };
  S.liked = !S.liked; S.likeCount += S.liked ? 1 : -1; // 先に表示を切り替える
  bumpCounts(); renderPanel();
  try {
    const id = S.trip.tripId;
    const r = await api('toggleLike', { tripId: id });
    if (S.trip && S.trip.tripId === id) { S.liked = r.liked; S.likeCount = r.likeCount; }
  } catch (e) {
    S.liked = prev.liked; S.likeCount = prev.count;
    toast(e.message, 'err');
  }
  likeBusy = false;
  if (S.trip) { bumpCounts(); renderPanel(); }
}

function closeModal(force) {

function bindForm(form, fn) {
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = form.querySelector('[type=submit]');
    const err = form.querySelector('.ferr');
    if (err) err.textContent = '';
    const orig = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = '処理中…'; }
    try { await fn(Object.fromEntries(new FormData(form)), form); }
    catch (x) { if (err) err.textContent = x.message; else toast(x.message, 'err'); }
    finally { if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = orig; } }
  });
}

/* ---------- スポットからルートを自動作成 ----------
 *  スポットを日時の順に並べ、OpenStreetMap の経路サーバー（routing.openstreetmap.de）で
 *  道路に沿って結ぶ。つながらない区間は直線で補う。自動作成のルートは、
 *  スポットの追加・移動・削除に合わせて作り直す。
 */
const AUTO_ROUTE_PREFIX = 'スポットから自動作成';
const SR_MODES = {
  car:  { lbl: '🚗 車',    name: '車',    host: 'routed-car' },
  bike: { lbl: '🚲 自転車', name: '自転車', host: 'routed-bike' },
  foot: { lbl: '🚶 徒歩',  name: '徒歩',  host: 'routed-foot' },
  line: { lbl: '📏 直線',  name: '直線',  host: '' }
};
const srSleep = ms => new Promise(r => setTimeout(r, ms));
let srTimer = null;
function defaultSrMode() { const t = S.trip && S.trip.tripType; return t === 'cycling' ? 'bike' : t === 'other' ? 'foot' : 'car'; }
function isAutoRoute() { return !!(S.route && String(S.route.name || '').indexOf(AUTO_ROUTE_PREFIX) === 0); }
function autoRouteMode() {
  const m = String((S.route && S.route.name) || '').match(/（(.+?)）/);
  return (m && Object.keys(SR_MODES).find(k => SR_MODES[k].name === m[1])) || defaultSrMode();
}
function routableSpots() {
  const out = [];
  sortedSpots().forEach(s => {
    const p = [+s.lat, +s.lng];
    if (!isFinite(p[0]) || !isFinite(p[1]) || Math.abs(p[0]) > 90 || Math.abs(p[1]) > 180) return;
    if (out.length && hav(out[out.length - 1], p) < 30) return; // 同じ場所が続くときは1か所に
    out.push(p);
  });
  return out;
}
function spotSig() { return routableSpots().map(p => p[0].toFixed(5) + ',' + p[1].toFixed(5)).join(';'); }

async function osrmRoute(host, pts) {
  const coords = pts.map(p => p[1].toFixed(6) + ',' + p[0].toFixed(6)).join(';');
  const url = `https://routing.openstreetmap.de/${host}/route/v1/driving/${coords}?overview=full&geometries=geojson&continue_straight=false`;
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 25000);
  let res;
  try { res = await fetch(url, { signal: ctl.signal }); }
  catch (e) { const er = new Error('経路サーバーに接続できませんでした'); er.net = true; throw er; }
  finally { clearTimeout(tm); }
  if (res.status === 429 || res.status >= 500) { const er = new Error('経路サーバーが混み合っています（' + res.status + '）'); er.net = true; throw er; }
  if (!res.ok) throw new Error('経路サーバーの応答エラー（' + res.status + '）');
  const j = await res.json();
  if (j.code !== 'Ok' || !j.routes || !j.routes[0] || !j.routes[0].geometry) throw new Error('道路沿いの経路が見つかりませんでした');
  const seg = j.routes[0].geometry.coordinates.map(c => [c[1], c[0], null, null]);
  if (seg.length < 2) throw new Error('経路が見つかりませんでした');
  // 道路から離れたスポットにもつながるよう、両端にスポットの位置そのものを足す
  const a = pts[0], b = pts[pts.length - 1];
  return [[a[0], a[1], null, null], ...seg, [b[0], b[1], null, null]];
}
async function buildSpotRoute(mode, onProg) {
  const pts = routableSpots(), legs = pts.length - 1;
  if (legs < 1) throw new Error('場所の違うスポットが2か所以上必要です');
  const pt = p => [p[0], p[1], null, null];
  if (mode === 'line' || !SR_MODES[mode]) return { points: pts.map(pt), legs, failed: 0, netDown: false };
  const host = SR_MODES[mode].host, CH = 25;
  let out = [], failed = 0, netDown = false, calls = 0;
  const call = async part => { if (calls++) await srSleep(1100); return osrmRoute(host, part); }; // サーバーへの配慮で1秒あける
  const add = seg => { out = out.concat(out.length ? seg.slice(1) : seg); };
  for (let i = 0; i < legs; i += CH - 1) {
    const part = pts.slice(i, i + CH);
    if (onProg) onProg(i, legs);
    let seg = null;
    if (!netDown) { try { seg = await call(part); } catch (e) { if (e.net) netDown = true; } }
    if (seg) { add(seg); continue; }
    // まとめて引けないときは1区間ずつ。それでもだめな区間は直線
    for (let k = 0; k < part.length - 1; k++) {
      let s2 = null;
      if (!netDown) { try { s2 = await call([part[k], part[k + 1]]); } catch (e) { if (e.net) netDown = true; } }
      if (!s2) { s2 = [pt(part[k]), pt(part[k + 1])]; failed++; }
      if (onProg) onProg(i + k + 1, legs);
      add(s2);
    }
  }
  if (onProg) onProg(legs, legs);
  return { points: out, legs, failed, netDown };
}

    <p class="ferr"></p>
    <button type="button" id="srGo" class="btn btn-route w-full" ${n < 2 ? 'disabled' : ''}>ルートを作る</button>`;

/* 自動作成ルートは、スポットが変わったら作り直す */
function scheduleAutoRoute() {
  if (!canEdit() || !isAutoRoute()) return;
  clearTimeout(srTimer);
  srTimer = setTimeout(autoRegenRoute, 1500);
}
async function autoRegenRoute() {
  if (!canEdit() || !isAutoRoute() || S.srBusy) return;
  const sig = spotSig();
  if (sig === S.srSig || routableSpots().length < 2) return;
  const tripId = S.trip.tripId, mode = autoRouteMode();
  S.srBusy = true;
  try {
    toast('スポットに合わせてルートを作り直しています…');
    const r = await buildSpotRoute(mode);
    if (!S.trip || S.trip.tripId !== tripId) return;
    if (r.netDown) { toast('経路サーバーにつながらず、ルートは更新していません。「スポットから作り直す」でやり直せます', 'err'); return; }
    const rt = normalizeRoute({ name: `${AUTO_ROUTE_PREFIX}（${SR_MODES[mode].name}）`, points: r.points });
    const st = computeStats(rt.points);
    const res = await api('saveRoute', { tripId, spotCount: S.spots.length, route: { name: rt.name, points: rt.points, stats: routeStatsPayload(st) } });
    if (!S.trip || S.trip.tripId !== tripId) return;
    S.trip = { ...S.trip, ...res.trip };
    syncTripInList(S.trip);
    delete S.routeCache[tripId];
    S.srSig = sig;
    setRoute(rt); renderPanel();
    toast('ルートを更新しました');
  } catch (e) {
    toast('ルートを更新できませんでした：' + e.message, 'err');
  } finally {
    S.srBusy = false;
    if (S.trip && S.trip.tripId === tripId && spotSig() !== sig) scheduleAutoRoute(); // 作成中にさらに変わった場合
  }
}

/* ---------- GPXのまとめて取り込み ----------
 * ファイル名の規則：「29 3 月 2025多摩川でキャンプ.gpx」
 *   前部「日 月 月 年」→ 出発日、後部 → タイトル
 *   「散歩」を含む→その他、「サイクリング」を含む→サイクリング、それ以外→ドライブ
 */
function parseTripFileName(name) {
  const base = name.replace(/^\d{10,}_/, '').replace(/\.[^.]+$/, '');
  const m = base.match(/^(\d{1,2})[\s_　]+(\d{1,2})[\s_　]*月[\s_　]*(\d{4})[\s_　]*(.*)$/);
  let date = '', title = base;
  if (m) {
    const d = +m[1], mo = +m[2], y = +m[3];
    const dt = new Date(y, mo - 1, d);
    if (dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d) date = `${y}-${pad2(mo)}-${pad2(d)}`;
    title = m[4];
  }
  title = title.replace(/[_\s　]+/g, ' ').trim() || base;
  const type = /散歩/.test(base) ? 'other' : (/サイクリング/.test(base) ? 'cycling' : 'drive');
  return { date, title: title.slice(0, 80), type };
}
function openBulkImport(files) {
  if (!S.user) { openAuth('login'); return; }
  S.bulk = { items: [], vis: 'private', running: false, done: false };
  renderBulk();
  if (files && files.length) addBulkFiles(files);
}
async function addBulkFiles(files) {
  const b = S.bulk;
  for (const f of Array.from(files)) {
    if (!ROUTE_EXT.test(f.name)) continue;
    if (b.items.some(x => x.fileName === f.name)) continue;
    const meta = parseTripFileName(f.name);
    const it = { fileName: f.name, ...meta, on: true, status: 'wait', msg: '', route: null, km: 0 };
    try {
      it.route = normalizeRoute(parseRouteText(await f.text(), meta.title));
      it.stats = computeStats(it.route.points);
      it.km = it.stats.distanceKm;
      if (!meta.date && it.stats.startTime) it.date = dateOf(it.stats.startTime);
      if (S.trips.some(t => t.title === it.title && t.startDate === it.date)) { it.on = false; it.msg = '登録済みのため外しました'; }
      else if (it.km < 0.1) it.msg = 'ほとんど移動していないルートです';
    } catch (e) {
      it.on = false; it.status = 'ng'; it.msg = e.message;
    }
    b.items.push(it);
  }
  b.items.sort((x, y) => String(x.date).localeCompare(String(y.date)));
  renderBulk();
}
function bulkStatus(it) {
  if (it.status === 'ok') return '<span class="st ok">✓ 取り込み済み</span>';
  if (it.status === 'run') return '<span class="st run">取り込み中…</span>';
  if (it.status === 'ng') return `<span class="st ng">× ${esc(it.msg)}</span>`;
  return it.msg ? `<span>${esc(it.msg)}</span>` : '<span></span>';
}
function renderBulk() {

  openModal(`<div class="mhead"><h3>GPXをまとめて取り込む</h3>${b.running ? '' : X_BTN}</div>

  $$('#modalRoot [data-bk]').forEach(el => el.addEventListener('change', () => {

    it[el.dataset.f] = el.value.trim();
  }));
  $$('#modalRoot input[name=bkVis]').forEach(r => r.addEventListener('change', () => { b.vis = r.value; }));
}
async function runBulk() {
  const b = S.bulk;
  const targets = b.items.filter(x => x.on && x.route && x.status !== 'ok');
  if (!targets.length) return;
  if (targets.some(x => !x.title)) { toast('タイトルが空の行があります', 'err'); return; }
  b.running = true; renderBulk();
  let ok = 0, ng = 0, k = 0;
  for (const it of targets) {
    const i = b.items.indexOf(it);
    it.status = 'run';
    const st = $('#bks_' + i); if (st) st.innerHTML = bulkStatus(it);
    const pg = $('#bkProg'); if (pg) pg.textContent = `${++k} / ${targets.length} 件目を取り込んでいます…`;
    try {
      const r = await api('importTrip', {
        trip: { title: it.title, tripType: it.type, startDate: it.date, endDate: '', description: '', visibility: b.vis },
        route: { name: it.title, points: it.route.points, stats: routeStatsPayload(it.stats) }
      });
      it.status = 'ok'; ok++;
      syncTripInList(r.trip);
    } catch (e) {
      it.status = 'ng'; it.msg = e.message; ng++;
      if (e.code === 'AUTH') break;
    }
    const st2 = $('#bks_' + i); if (st2) st2.innerHTML = bulkStatus(it);
    const box = $('#bk_' + i); if (box) box.scrollIntoView({ block: 'nearest' });
  }
  b.running = false; b.done = !b.items.some(x => x.on && x.route && x.status !== 'ok');
  S.publicLoaded = false;
  renderBulk();
  const pg = $('#bkProg'); if (pg) pg.textContent = `取り込み完了：成功 ${ok}件${ng ? `、失敗 ${ng}件（失敗した行はもう一度取り込めます）` : ''}`;
  toast(`${ok}件のトリップを取り込みました`);
  loadTrips();
}
async function importFromFile(file) {
  try {
    const parsed = parseRouteText(await file.text(), file.name.replace(/\.[^.]+$/, ''));
    if (!$('#modalRoot').classList.contains('hidden') && $('#impBody')) closeModal();
    await importRoute(parsed);
  } catch (e) {
    const err = $('#impBody .ferr');
    if (err) err.textContent = e.message; else toast(e.message, 'err');
  }
}
function exportGpx() {
  if (!S.route) return;
  const x = s => String(s).replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
  const name = (S.trip && S.trip.title) || S.route.name || 'route';
  const pts = S.route.points.map(p => `<trkpt lat="${p[0]}" lon="${p[1]}">${p[2] != null ? `<ele>${p[2]}</ele>` : ''}${p[3] != null ? `<time>${new Date(p[3]).toISOString()}</time>` : ''}</trkpt>`).join('\n');
  const xml = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="wadachi-log" xmlns="http://www.topografix.com/GPX/1/1">\n<trk><name>${x(name)}</name><trkseg>\n${pts}\n</trkseg></trk>\n</gpx>\n`;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([xml], { type: 'application/gpx+xml' }));
  a.download = name.replace(/[\\/:*?"<>|]/g, '_') + '.gpx';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function copyText(text, okMsg) {
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(okMsg); } catch (x) { toast('コピーできませんでした', 'err'); }
    ta.remove();
  }
}

/* ---------- media ---------- */
function resizeImage(file, max, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const s = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * s); h = Math.round(h * s);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('画像を変換できませんでした')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('画像を読み込めませんでした')); };
    img.src = url;
  });
}
async function prepareUpload(f) {
  if (/^video\//.test(f.type)) {
    if (f.size > MAX_VIDEO_MB * 1048576) throw new Error(`動画「${f.name}」は${MAX_VIDEO_MB}MBを超えています。短く切り出してから追加してください`);
    return { name: f.name, mimeType: f.type, blob: f };
  }
  if (f.type === 'image/gif') return { name: f.name, mimeType: f.type, blob: f };
  try {
    const b = await resizeImage(f, 2048, 0.85);
    return { name: f.name.replace(/\.[^.]+$/, '') + '.jpg', mimeType: 'image/jpeg', blob: b };
  } catch (e) {
    if (f.size > 20 * 1048576) throw new Error(`写真「${f.name}」を読み込めませんでした`);
    return { name: f.name, mimeType: f.type || 'image/jpeg', blob: f };
  }
}
function blobToB64(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = () => rej(new Error('ファイルを読み込めませんでした'));
    r.readAsDataURL(blob);
  });
}
async function uploadFile(file) {
  const p = await prepareUpload(file);
  const data = await blobToB64(p.blob);
  const r = await api('uploadMedia', { tripId: S.trip.tripId, fileName: p.name, mimeType: p.mimeType, data });
  if (r.warning) toast(r.warning, 'err');
  return r.media;
}
async function readExif(f) {
  const out = { lat: null, lng: null, time: null };
  if (!/^image\//.test(f.type) || !window.exifr) return out;
  try {
    const x = await exifr.parse(f, { gps: true });
    if (x) {
      if (isFinite(x.latitude) && isFinite(x.longitude)) { out.lat = x.latitude; out.lng = x.longitude; }
      const d = x.DateTimeOriginal || x.CreateDate;
      if (d instanceof Date && !isNaN(d)) out.time = d.getTime();
    }
  } catch (e) { /* Exifなし */ }
  return out;
}
function requireTrip() {
  if (!S.user) { toast('保存にはログインが必要です', 'err'); openAuth('login'); return false; }
  if (!S.trip) { toast('先にトリップを開くか、新しく作ってください', 'err'); return false; }
  if (!canEdit()) { toast('他の会員のトリップには追加できません', 'err'); return false; }
  return true;
}
function upsertSpot(s) {
  const i = S.spots.findIndex(x => x.spotId === s.spotId);
  if (i >= 0) S.spots[i] = s; else S.spots.push(s);
  S.trip.spotCount = S.spots.length;
  syncTripInList({ tripId: S.trip.tripId, spotCount: S.spots.length });
  scheduleAutoRoute();
}
async function addMediaFlow(files) {
  if (!requireTrip()) return;
  files = files.filter(f => /^(image|video)\//.test(f.type));
  if (!files.length) return;
  toast('撮影地点を読み取っています…');
  const items = [];
  for (const f of files) items.push({ file: f, ...(await readExif(f)) });
  const geo = items.filter(x => x.lat != null).sort((a, b) => (a.time || 0) - (b.time || 0));
  const noGeo = items.filter(x => x.lat == null);
  // 80m以内に続けて撮った写真は同じスポットにまとめる
  const groups = [];
  geo.forEach(it => {
    const g = groups[groups.length - 1];
    if (g && hav([g.lat, g.lng], [it.lat, it.lng]) < 80) g.items.push(it);
    else groups.push({ lat: it.lat, lng: it.lng, time: it.time, items: [it] });
  });
  if (!groups.length) { placeManually(noGeo); return; }
  openModal(`<div class="mhead"><h3>写真を撮影地点に配置</h3>${X_BTN}</div>
    <p style="line-height:1.8">位置情報つきの写真 <b>${geo.length}枚</b> を、撮影地点ごとに <b>${groups.length}か所</b> のピンとして追加します。</p>
    ${noGeo.length ? `<p class="text-sm muted mt-2" style="line-height:1.7">位置情報のない ${noGeo.length}件（動画を含む）は、このあと地図をタップして場所を決めます。</p>` : ''}
    <p class="ferr"></p><p id="plProg" class="text-sm muted"></p>
    <div class="flex justify-end gap-2 mt-4"><button class="btn btn-ghost" data-act="closeModal">やめる</button><button class="btn btn-route" id="plGo">追加する</button></div>`);
  $('#plGo').addEventListener('click', async ev => {
    const btn = ev.currentTarget;
    btn.disabled = true; modalLocked = true;
    let done = 0;
    try {
      for (const g of groups) {
        const media = [];
        for (const it of g.items) {
          $('#plProg').textContent = `アップロード中 ${++done} / ${geo.length}`;
          media.push(await uploadFile(it.file));
        }
        const r = await api('saveSpot', { spot: { tripId: S.trip.tripId, lat: g.lat, lng: g.lng, title: '', memo: '', takenAt: g.time ? new Date(g.time).toISOString() : '', source: 'exif', media } });
        upsertSpot(r.spot);
      }
      closeModal(true); drawSpots(); fitAll(); renderPanel();
      toast(`${groups.length}か所にピンを追加しました`);
      placeManually(noGeo);
    } catch (e) {
      modalLocked = false; btn.disabled = false;
      $('#modalRoot .ferr').textContent = e.message + '（追加できた分は保存されています）';
      drawSpots(); renderPanel();
    }
  });
}
function placeManually(items) {
  if (!items.length) return;
  const t = items.map(x => x.time).filter(Boolean).sort((a, b) => a - b)[0];
  startPick(`位置情報のない${items.length}件の場所をタップ`, ll => {
    openSpotEditor({ lat: ll.lat, lng: ll.lng, source: 'map', takenAt: t ? new Date(t).toISOString() : '' }, items.map(x => x.file));
  });
}

async function saveSpotFromEditor() {
  captureEditorFields();
  const ed = S.editor, sp = ed.spot;
  modalLocked = true;
  try {
    const total = ed.files.length;
    let n = 0;
    while (ed.files.length) { // 1件ずつ上げ、成功したものから確定（再試行で重複しない）
      $('#edProg').textContent = `アップロード中 ${++n} / ${total}`;
      const m = await uploadFile(ed.files[0]);
      sp.media.push(m); ed.files.shift(); renderEdMedia();
    }
    $('#edProg').textContent = '保存しています…';
    const r = await api('saveSpot', { spot: { spotId: sp.spotId || '', tripId: S.trip.tripId, lat: sp.lat, lng: sp.lng, title: sp.title, memo: sp.memo, takenAt: sp.takenAt, source: sp.source || 'map', media: sp.media } });
    upsertSpot(r.spot);
    S.editor = null;
    closeModal(true); drawSpots(); renderPanel();
    toast('スポットを保存しました');
  } finally {
    modalLocked = false;
    const p = $('#edProg'); if (p) p.textContent = '';
  }
}
async function deleteSpot() {
  const sp = S.editor.spot;
  if (!confirm('このスポットを削除します。添付した写真・動画も削除されます。よろしいですか？')) return;
  try {
    await api('deleteSpot', { spotId: sp.spotId });
    S.spots = S.spots.filter(x => x.spotId !== sp.spotId);

    scheduleAutoRoute();
    S.editor = null;
    closeModal(true); drawSpots(); renderPanel(); toast('スポットを削除しました');

}

/* ============================================================
 * 音声入力（言葉の間があいても止まらないよう、自動で聞き取りを再開）
 * ============================================================ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const IS_ANDROID = /Android/i.test(navigator.userAgent);
const Dict = { on: false, rec: null, ta: null, base: '', lastHeard: 0, timer: null };
function micBtn(id) {
  return SR ? `<button type="button" class="mic" data-act="mic" data-target="${id}" aria-pressed="false">🎤 音声入力</button>` : '';
}
function toggleDict(btn) {
  const ta = document.getElementById(btn.dataset.target);
  if (!ta) return;
  if (Dict.on) { const same = Dict.ta === ta; stopDict(); if (same) return; }
  stopSpeak();
  Dict.on = true; Dict.ta = ta; Dict.base = ta.value; Dict.lastHeard = Date.now();
  runRec();
  Dict.timer = setInterval(() => {
    if (!Dict.ta || !Dict.ta.isConnected) { stopDict(); return; }
    if (Date.now() - Dict.lastHeard > 180000) { stopDict(); toast('3分間声が聞こえなかったので、音声入力を止めました'); }
  }, 1000);
  refreshVoiceUi();
  toast('聞き取りを始めました。話し終わったら「止める」を押してください');
}
function setDictText(v) {
  const ta = Dict.ta;
  if (!ta || !ta.isConnected) return;
  const max = Number(ta.getAttribute('maxlength')) || 0;
  ta.value = max ? v.slice(0, max) : v;
  ta.dispatchEvent(new Event('input', { bubbles: true }));
  ta.scrollTop = ta.scrollHeight;
}
function runRec() {
  let r;
  try { r = new SR(); } catch (e) { stopDict(); toast('この端末では音声入力を使えません', 'err'); return; }
  r.lang = 'ja-JP';
  r.continuous = !IS_ANDROID; // Android は連続モードで文字が重複するため、1回ずつ自動再開する
  r.interimResults = true;
  r.maxAlternatives = 1;
  let fin = '';
  r.onresult = e => {
    let f = '', it = '';
    for (let i = 0; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) f += t; else it += t;
    }
    fin = f;
    Dict.lastHeard = Date.now();
    setDictText(Dict.base + f + it);
  };
  r.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { stopDict(); toast('マイクの使用が許可されていません。ブラウザの設定でマイクを許可してください', 'err'); }
    else if (e.error === 'audio-capture') { stopDict(); toast('マイクが見つかりません', 'err'); }
    // no-speech（無音）・network・aborted は onend で聞き取りを再開する
  };
  r.onend = () => {
    if (Dict.rec !== r) return;
    Dict.base = Dict.base + fin;
    setDictText(Dict.base);
    if (Dict.on) setTimeout(() => { if (Dict.on && Dict.rec === r) runRec(); }, 200);
  };
  Dict.rec = r;
  try { r.start(); }
  catch (e) { setTimeout(() => { if (Dict.on && Dict.rec === r) runRec(); }, 600); }
}
function stopDict() {
  const r = Dict.rec;
  Dict.on = false; Dict.rec = null;
  clearInterval(Dict.timer); Dict.timer = null;
  if (r) { try { r.stop(); } catch (e) { /* 停止済み */ } }
  Dict.ta = null;
  refreshVoiceUi();
}

/* ============================================================
 * 読み上げ（端末の音声合成）
 * ============================================================ */
const TTS = { id: null };
function spkBtn(id) { return 'speechSynthesis' in window ? `<button type="button" class="spk" data-act="speak" data-target="${id}">🔊 読み上げ</button>` : ''; }
function cleanForSpeech(s) {
  const meta = /(読み上げ|朗読|ナレーション|音読|口調で|トーンで|声で).{0,20}(ください|下さい|します)|^(以下|下記)(は|に|が).{0,40}(です|ます|します)[。:：]?$|^(はい|承知|かしこまり|了解)/;
  const lines = String(s || '').split('\n').map(x => x.trim());
  while (lines.length && (!lines[0] || meta.test(lines[0]))) lines.shift();
  return lines.join('\n')
    .replace(/https?:\/\/\S+/g, '')
    .replace(/#(\S+)/g, '$1')
    .replace(/[【】＊*＃]/g, ' ')
    .replace(/^・/gm, '')
    .trim();
}
function speakText(text, id) {
  if (!('speechSynthesis' in window)) { toast('この端末は読み上げに対応していません', 'err'); return; }
  const same = TTS.id === id;
  stopSpeak();
  if (same) return;
  stopDict();
  const clean = cleanForSpeech(text);
  if (!clean) return;
  const parts = [];
  clean.split(/(?<=[。！？!?\n])/).forEach(p => {
    p = p.trim(); if (!p) return;
    if (parts.length && (parts[parts.length - 1] + p).length < 120) parts[parts.length - 1] += p; else parts.push(p);
  });
  const voice = speechSynthesis.getVoices().find(v => /^ja/i.test(v.lang));
  TTS.id = id;
  parts.forEach((p, i) => {
    const u = new SpeechSynthesisUtterance(p);
    u.lang = 'ja-JP'; u.rate = 1; if (voice) u.voice = voice;
    if (i === parts.length - 1) u.onend = () => { if (TTS.id === id) { TTS.id = null; refreshVoiceUi(); } };
    u.onerror = () => { if (TTS.id === id) { TTS.id = null; refreshVoiceUi(); } };
    speechSynthesis.speak(u);
  });
  refreshVoiceUi();
}
function stopSpeak() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  TTS.id = null;
  refreshVoiceUi();
}
function refreshVoiceUi() {
  $$('[data-act=mic]').forEach(b => {
    const on = Dict.on && Dict.ta && b.dataset.target === Dict.ta.id;
    b.classList.toggle('on', !!on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
    b.textContent = on ? '止める（聞き取り中）' : '🎤 音声入力';
  });
  $$('[data-act=speak]').forEach(b => {
    const on = TTS.id === b.dataset.target;
    b.classList.toggle('on', on); b.textContent = on ? '■ 止める' : '🔊 読み上げ';
  });
}

/* ---------- global events ---------- */
function hasFiles(e) { return e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files'); }
async function handleDroppedFiles(files, zone) {
  files = Array.from(files);
  if (zone === 'import') { const f = files.find(x => ROUTE_EXT.test(x.name)) || files[0]; if (f) importFromFile(f); return; }
  if (zone === 'trip') { const f = files.find(x => ROUTE_EXT.test(x.name)); if (f) setTripFormRoute(f); else toast('GPX・KML・GeoJSON を選んでください', 'err'); return; }
  if (zone === 'editor') { addEditorFiles(files); return; }
  if (zone === 'bulk') { addBulkFiles(files); return; }
  if (zone === 'routeimg') { const f = files.find(x => /^image\//.test(x.type)); if (f) setRouteImage(f); else toast('画像ファイルを選んでください', 'err'); return; }
  if (!$('#modalRoot').classList.contains('hidden')) return; // モーダル表示中は背面へのドロップを無視
  const routeFs = files.filter(f => ROUTE_EXT.test(f.name));
  if (routeFs.length > 1 && S.user && !S.trip) { openBulkImport(routeFs); return; }
  const routeF = routeFs[0];
  const media = files.filter(f => /^(image|video)\//.test(f.type));
  if (routeF) {
    try { await importRoute(parseRouteText(await routeF.text(), routeF.name.replace(/\.[^.]+$/, ''))); }
    catch (e) { toast(e.message, 'err'); }
  }
  if (media.length) addMediaFlow(media);
  if (!routeF && !media.length) toast('読み込めるのは GPX・KML・GeoJSON と、写真・動画です', 'err');
}
function bindGlobal() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    const menu = $('#acctMenu');
    if (menu && !menu.classList.contains('hidden') && (!e.target.closest('#acctWrap') || e.target.closest('#acctMenu button'))) menu.classList.add('hidden');
    if (el && el.dataset.act !== 'sheet') runAct(el, e);
  });
  $('#modalRoot').addEventListener('mousedown', e => { if (e.target.id === 'modalRoot') closeModal(); });
  document.addEventListener('change', e => {
    if (e.target.id === 'aiPhotos') S.aiPhotos = e.target.checked;
    if (e.target.dataset && e.target.dataset.sel) setSelected([e.target.dataset.sel], e.target.checked, true);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (!$('#modalRoot').classList.contains('hidden')) closeModal();
      else if (S.pick) endPick();
      else { const m = $('#acctMenu'); if (m) m.classList.add('hidden'); }
    }
    if (S.viewer && (e.key === 'ArrowRight' || e.key === 'ArrowLeft') && S.viewer.s.media.length > 1) {
      ACT.lbNav({ dataset: { d: e.key === 'ArrowRight' ? 1 : -1 } });
    }
  });
  $('#fileRoute').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) handleDroppedFiles([f]); });
  $('#filePhotos').addEventListener('change', e => { const fs = [...e.target.files]; e.target.value = ''; if (fs.length) addMediaFlow(fs); });
  $('#pbRange').addEventListener('input', e => { pbPause(); pbHideCard(); PB.shown.clear(); pbSet(Number(e.target.value) / 1000); });

  let dragN = 0;
  const ov = $('#dropOverlay');
  document.addEventListener('dragenter', e => {
    if (!hasFiles(e)) return;
    e.preventDefault(); dragN++;
    if ($('#modalRoot').classList.contains('hidden')) ov.classList.remove('hidden');
    const z = e.target.closest && e.target.closest('[data-drop]'); if (z) z.classList.add('over');
  });
  document.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  document.addEventListener('dragleave', e => {
    if (!hasFiles(e)) return;
    dragN = Math.max(0, dragN - 1);
    const z = e.target.closest && e.target.closest('[data-drop]'); if (z) z.classList.remove('over');
    if (!dragN) ov.classList.add('hidden');
  });
  document.addEventListener('drop', e => {
    if (!hasFiles(e)) return;
    e.preventDefault(); dragN = 0; ov.classList.add('hidden');
    const z = e.target.closest && e.target.closest('[data-drop]');
    $$('[data-drop].over').forEach(x => x.classList.remove('over'));
    handleDroppedFiles(e.dataTransfer.files, z ? z.dataset.drop : null);
  });
  window.addEventListener('resize', () => map && map.invalidateSize());
  bindSheet();
}

async function boot() {
  S.pendingTrip = new URLSearchParams(location.search).get('trip') || null;

  if (!CONFIG_LOADED) console.warn('config.js を読み込めなかったため、index.html の DEFAULT_GAS_URL を使っています');
  if (!S.token) {
    if (gasReady()) api('ping').then(r => { S.serverVersion = r.serverVersion || ''; if (!S.user) renderPanel(); }).catch(() => {});
    if (S.pendingTrip) { openAuth('login'); toast('共有されたトリップを見るには、ログインしてください'); }
    return;
  }
  try {
    const r = await api('me');
    S.serverVersion = r.serverVersion || '';
    setSession(null, r.user);
    renderAll();
    await postAuthFlow();
  } catch (e) {
    if (e.code !== 'AUTH' && e.code !== 'AGREE') toast(e.message, 'err');
  }
}
boot();
</script>
